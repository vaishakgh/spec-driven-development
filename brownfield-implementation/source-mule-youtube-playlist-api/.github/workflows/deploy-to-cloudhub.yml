name: Deploy Mule App to CloudHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    name: Build Mule Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          mvn clean package -DskipTests \
            -s settings.xml \
            -Danypoint.username=${{ secrets.ANYPOINT_USERNAME }} \
            -Danypoint.password=${{ secrets.ANYPOINT_PASSWORD }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: mule-app
          path: target/*.jar
          retention-days: 5

  deploy:
    name: Deploy to CloudHub
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download Build Artifact
        uses: actions/download-artifact@v3
        with:
          name: mule-app
          path: target/

      - name: Deploy to CloudHub
        run: |
          mvn deploy -DmuleDeploy \
            -DskipTests \
            -s settings.xml \
            -Danypoint.username=${{ secrets.ANYPOINT_USERNAME }} \
            -Danypoint.password=${{ secrets.ANYPOINT_PASSWORD }} \
            -Danypoint.environment=${{ secrets.ANYPOINT_ENVIRONMENT }} \
            -Dyoutube.api.key=${{ secrets.YOUTUBE_API_KEY }} \
            -Dyoutube.api.playlistId=${{ secrets.YOUTUBE_PLAYLIST_ID }}

      - name: Deployment Success
        run: |
          echo "✅ Successfully deployed youtube-playlist-api to CloudHub!"
          echo "🌍 URL: https://youtube-playlist-api.cloudhub.io/youtube/playlists"
