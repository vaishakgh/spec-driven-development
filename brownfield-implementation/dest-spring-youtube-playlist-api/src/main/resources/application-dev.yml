# Dev environment profile
# Deployed via Kubernetes; YOUTUBE_API_KEY injected from K8s Secret
youtube:
  api:
    base-url: https://www.googleapis.com/youtube/v3
    max-results: 25

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs
