apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-playlist-api
  labels:
    app: youtube-playlist-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: youtube-playlist-api
  template:
    metadata:
      labels:
        app: youtube-playlist-api
    spec:
      containers:
        - name: youtube-playlist-api
          # Replace with your registry and a versioned tag before deploying, e.g.:
          # <REGISTRY>/youtube-playlist-api:<VERSION>
          image: youtube-playlist-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: youtube-playlist-api-config
                  key: SPRING_PROFILES_ACTIVE
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: youtube-playlist-api-secret
                  key: YOUTUBE_API_KEY
            - name: YOUTUBE_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: youtube-playlist-api-config
                  key: YOUTUBE_API_BASE_URL
            - name: YOUTUBE_API_MAX_RESULTS
              valueFrom:
                configMapKeyRef:
                  name: youtube-playlist-api-config
                  key: YOUTUBE_API_MAX_RESULTS
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
